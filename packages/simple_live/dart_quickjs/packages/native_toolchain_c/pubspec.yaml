name: quickjs_native_toolchain_c
description: >-
  A library to invoke the native C compiler installed on the host machine.
version: 0.17.4
repository: https://github.com/dart-lang/native/tree/main/pkgs/native_toolchain_c

topics:
  - compiler
  - ffi
  - interop
  - native-assets
  - native-toolchain

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  quickjs_code_assets:
    path: ../quickjs_code_assets
  glob: ^2.1.1
  quickjs_hooks:
    path: ../quickjs_hooks
  logging: ^1.3.0
  meta: ^1.16.0
  pub_semver: ^2.2.0

dev_dependencies:
  collection: ^1.19.1
  custom_lint: ^0.7.5
  dart_flutter_team_lints: ^3.5.2
  test: ^1.25.15
