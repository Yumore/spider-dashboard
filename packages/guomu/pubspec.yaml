name: guomu
description: 果幕 - 黄果短剧第三方 Flutter 客户端。
publish_to: 'none'
version: 1.4.3+8

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  html: ^0.15.6
  live_activities: ^2.4.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  # The cover decoder uses the same AES-CBC API available in PointyCastle 3.9.1.
  # Pinning the compatible major keeps this package compatible with Dashboard's crypton dependency.
  pointycastle: ^3.9.1
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  waterfall_flow: ^3.1.1
  web: ^1.1.1
  workmanager: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/data/source_manifest.json
  fonts:
    - family: GuomuLatin
      fonts:
        - asset: assets/fonts/GuomuLatin-Regular.ttf
          weight: 400
        - asset: assets/fonts/GuomuLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/GuomuLatin-Bold.ttf
          weight: 700
    - family: GuomuCJK
      fonts:
        - asset: assets/fonts/GuomuCJK.ttf

dependency_overrides:
  workmanager_platform_interface: 0.9.3
  workmanager_android: 0.9.2
