name: live_media
description: Playback core of Pure Live — turns play lines and input recipes into engine inputs, relays FLV and HLS locally in pure Dart, orders fallbacks and classifies player errors.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0


dependencies:
  clock: ^1.1.3
  live_core:
    path: ../live_core
  live_net:
    path: ../live_net
  meta: ^1.19.0

dev_dependencies:
  fake_async: ^1.3.3
  test: ^1.33.0
  very_good_analysis: ^11.0.0
