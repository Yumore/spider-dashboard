name: dashboard
description: Unified reading, media, community and live-content dashboard.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.23.0+230000

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.2.0
  file_picker: ^13.3.0
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2
  flutter_foreground_task: ^9.2.2
  nsd: ^5.0.0
  path: ^1.9.1
  window_manager: ^0.5.1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  html: ^0.15.6
  enough_convert: ^1.6.0
  image_picker: ^1.2.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  dio: ^5.9.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  cached_network_image: ^4.0.5
  flutter_cache_manager: ^3.4.1
  flutter_easyrefresh: ^2.2.2
  flutter_spinkit: ^5.2.2
  carousel_slider: ^5.1.1
  common_utils: ^2.1.0
  event_bus: ^2.0.1
  transparent_image: ^2.0.1
  html_unescape: ^2.0.0
  webview_flutter: ^4.13.0
  photo_view: ^0.15.0
  fluttertoast: ^9.0.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.4
  sqflite_common_ffi_web: ^1.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  battery_plus: ^7.0.0
  characters: ^1.4.0
  connectivity_plus: ^7.0.0
  wakelock_plus: ^1.4.0
  screen_brightness: ^2.1.7
  path_provider: ^2.1.5
  preload_page_view: ^0.2.0
  package_info_plus: ^10.0.0
  crypton: ^2.2.1
  crypto: ^3.0.7
  protobuf: ^4.2.0
  qr_flutter: ^4.1.0
  xml: ^6.5.0
  pure_live:
    path: packages/pure_live/app
  kazumi:
    path: packages/kazumi_webdav
  simple_live_app:
    path: packages/simple_live/simple_live_app
  simple_live_tv_app:
    path: packages/simple_live/simple_live_tv_app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
# sqlite3 3.x 通过 build hooks 下载预编译二进制；GitHub 直连在部分网络下失败，
# 这里改用镜像地址（sha256 校验仍由 package 保证）。
hooks:
  user_defines:
    sqlite3:
      url_pattern: "https://ghproxy.net/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

flutter:

    # The following line ensures that the Material Icons font is
    # included with your application, so that you can use the icons in
    # the material Icons class.
    uses-material-design: true

    # To add assets to your application, add an assets section, like this:
    assets:
        - assets/
        - assets/video_enhancement/
        - assets/billd_live/tabbar/
        - assets/dodu/
        - assets/fluttersocial_demo/
        - assets/fluttersocialappuikit_demo/
        - assets/flutterwechat_demo/
        - assets/flutterwechatfull_demo/
        - assets/short_video/images/
        - assets/short_video/videos/
        - lib/features/movie/flutterdouban/mock/

    # An image asset can refer to one or more resolution-specific "variants", see
    # https://flutter.dev/assets-and-images/#resolution-aware.

    # For details regarding adding assets from package dependencies, see
    # https://flutter.dev/assets-and-images/#from-packages

    # To add custom fonts to your application, add a fonts section here,
    # in this "flutter" section. Each entry in this list should have a
    # "family" key with the font family name, and a "fonts" key with a
    # list giving the asset and other descriptors for the font. For
    # example:
    # fonts:
    #   - family: Schyler
    #     fonts:
    #       - asset: fonts/Schyler-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    #   - family: Trajan Pro
    #     fonts:
    #       - asset: fonts/TrajanPro.ttf
    #       - asset: fonts/TrajanPro_Bold.ttf
    #         weight: 700
    #
    # For details regarding fonts from package dependencies,
    # see https://flutter.dev/custom-fonts/#from-packages

dependency_overrides:
  window_manager:
    path: packages/pure_live/third_party/window_manager
  dbus: 0.8.0
  win32: ^6.0.0
