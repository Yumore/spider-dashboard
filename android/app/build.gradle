plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('config.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def hasReleaseSigning = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
    .every { signingProperties.getProperty("config.$it") }

android {
    namespace 'com.yumore.spiderx.flutter'
    compileSdk flutter.compileSdkVersion
    ndkVersion providers.gradleProperty('dashboardNdkVersion').getOrElse(flutter.ndkVersion)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.yumore.spiderx.flutter'
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                enableV3Signing true
                enableV4Signing true
                keyAlias signingProperties.getProperty('config.keyAlias')
                keyPassword signingProperties.getProperty('config.keyPassword')
                storeFile file(signingProperties.getProperty('config.storeFile'))
                storePassword signingProperties.getProperty('config.storePassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation('com.github.yangfeng1994:FFmpeg-Android:v2.0.1') {
        exclude group: 'com.android.support'
    }
}

def shortDramaBuildScript = rootProject.file('../tool/build_short_drama_native.py')
def shortDramaNativeOutput = file('src/main/jniLibs')
def pythonExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
def shortDramaAllSources = true
def encodedDartDefines = project.findProperty('dart-defines')
if (encodedDartDefines instanceof String) {
    encodedDartDefines.split(',').each { encodedDefine ->
        try {
            def define = new String(java.util.Base64.getDecoder().decode(encodedDefine), 'UTF-8')
            if (define.startsWith('ALL_SOURCES=')) {
                shortDramaAllSources = define.substring('ALL_SOURCES='.length()).toBoolean()
            }
        } catch (IllegalArgumentException ignored) {
            // Ignore malformed values; Flutter supplies other dart defines here too.
        }
    }
}
def buildShortDramaNative = tasks.register('buildShortDramaNative', Exec) {
    inputs.file(shortDramaBuildScript)
    inputs.files(fileTree(rootProject.file('../native')) {
        include '**/*.go', 'go.mod', 'go.sum'
    })
    inputs.property('shortDramaAllSources', shortDramaAllSources.toString())
    outputs.dir(shortDramaNativeOutput)
    workingDir rootProject.projectDir.parentFile
    commandLine pythonExecutable, shortDramaBuildScript.absolutePath
    environment 'SHORT_DRAMA_ALL_SOURCES', shortDramaAllSources.toString()
}

tasks.named('preBuild').configure {
    dependsOn(buildShortDramaNative)
}

tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'validateSigningRelease']) {
        task.doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException('Release signing requires android/config.properties.')
            }
        }
    }
}
