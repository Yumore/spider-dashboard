plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('config.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def hasReleaseSigning = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
    .every { signingProperties.getProperty("config.$it") }
def novelSoundPinnedNdkVersion = '28.2.13676358'
def configuredNdkVersion = providers.gradleProperty('dashboardNdkVersion')
    .getOrElse(novelSoundPinnedNdkVersion)
if (configuredNdkVersion != novelSoundPinnedNdkVersion) {
    throw new GradleException("Novel Sound Rust builds require Android NDK ${novelSoundPinnedNdkVersion}; dashboardNdkVersion is ${configuredNdkVersion}.")
}

android {
    namespace 'com.yumore.spiderx.flutter'
    compileSdk flutter.compileSdkVersion
    ndkVersion novelSoundPinnedNdkVersion

    externalNativeBuild {
        cmake {
            path file('../../packages/novel_sound/native/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.yumore.spiderx.flutter'
        minSdkVersion 26
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        externalNativeBuild {
            cmake {
                targets 'shortplay_crypto', 'shortplay_tempo'
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                enableV3Signing true
                enableV4Signing true
                keyAlias signingProperties.getProperty('config.keyAlias')
                keyPassword signingProperties.getProperty('config.keyPassword')
                storeFile file(signingProperties.getProperty('config.storeFile'))
                storePassword signingProperties.getProperty('config.storePassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

afterEvaluate {
    def configuredReleaseRules = android.getDefaultProguardFile('proguard-android-optimize.txt')
    def releaseOptimizedRules = rootProject.layout.buildDirectory
        .dir("${project.name}/intermediates/default_proguard_files/global/${configuredReleaseRules.name}")
        .get()
        .asFile
    def releaseProguardFiles = android.buildTypes.getByName('release').proguardFiles
    releaseProguardFiles.removeAll { configuredFile ->
        configuredFile.name == releaseOptimizedRules.name &&
            configuredFile.absolutePath != releaseOptimizedRules.absolutePath
    }
    if (!releaseProguardFiles.contains(releaseOptimizedRules)) {
        releaseProguardFiles.add(releaseOptimizedRules)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'commons-net:commons-net:3.12.0'
    implementation 'com.hierynomus:smbj:0.14.0'
    implementation 'org.glassfish:javax.el:3.0.1-b12'

    // Expose the FFmpegKit API supplied at runtime by the Flutter plugin so
    // the short-drama platform bridge can use the same native implementation.
    compileOnly 'com.antonkarpenko:ffmpeg-kit-min-gpl:2.2.3'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}

def shortDramaBuildScript = rootProject.file('../tool/build_short_drama_native.py')
def shortDramaNativeOutput = file('src/main/jniLibs')
def pythonExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
def shortDramaAllSources = true
def encodedDartDefines = project.findProperty('dart-defines')
if (encodedDartDefines instanceof String) {
    encodedDartDefines.split(',').each { encodedDefine ->
        try {
            def define = new String(java.util.Base64.getDecoder().decode(encodedDefine), 'UTF-8')
            if (define.startsWith('ALL_SOURCES=')) {
                shortDramaAllSources = define.substring('ALL_SOURCES='.length()).toBoolean()
            }
        } catch (IllegalArgumentException ignored) {
            // Ignore malformed values; Flutter supplies other dart defines here too.
        }
    }
}
def buildShortDramaNative = tasks.register('buildShortDramaNative', Exec) {
    inputs.file(shortDramaBuildScript)
    inputs.files(fileTree(rootProject.file('../native')) {
        include '**/*.go', 'go.mod', 'go.sum'
    })
    inputs.property('shortDramaAllSources', shortDramaAllSources.toString())
    outputs.dir(shortDramaNativeOutput)
    workingDir rootProject.projectDir.parentFile
    commandLine pythonExecutable, shortDramaBuildScript.absolutePath
    environment 'SHORT_DRAMA_ALL_SOURCES', shortDramaAllSources.toString()
}

def novelSoundRustBuildScript = rootProject.file('../packages/novel_sound/scripts/build_rust_backend.sh')
def novelSoundRustBuildScriptPs1 = rootProject.file('../packages/novel_sound/scripts/build_rust_backend.ps1')
def windowsHost = System.getProperty('os.name').toLowerCase().contains('windows')
def buildNovelSoundRust = tasks.register('buildNovelSoundRust', Exec) {
    inputs.files(fileTree(rootProject.file('../packages/novel_sound/rust')) {
        include 'src/**', 'Cargo.toml', 'Cargo.lock', 'build.rs'
    })
    inputs.file(novelSoundRustBuildScript)
    outputs.files(
        file('src/main/jniLibs/arm64-v8a/libfqapi_core.so'),
        file('src/main/jniLibs/armeabi-v7a/libfqapi_core.so'),
    )
    workingDir rootProject.projectDir.parentFile
    environment 'NOVEL_SOUND_FLUTTER_ROOT', rootProject.projectDir.parentFile.absolutePath
    if (windowsHost) {
        inputs.file(novelSoundRustBuildScriptPs1)
        commandLine 'powershell', '-ExecutionPolicy', 'Bypass', '-File', novelSoundRustBuildScriptPs1.absolutePath, '-SkipCodegen'
    } else {
        commandLine 'bash', novelSoundRustBuildScript.absolutePath, '--skip-codegen'
    }
}

tasks.named('preBuild').configure {
    dependsOn(buildShortDramaNative, buildNovelSoundRust)
}

tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'validateSigningRelease']) {
        task.doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException('Release signing requires android/config.properties.')
            }
        }
    }
}
